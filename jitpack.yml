# JitPack build for the MoveAPiece development branch only (not part of any upstream PR):
# JitPack's default Maven wrapper download from Maven Central failed, so install Maven via SDKMAN;
# no Javadoc jar (its plugin fails on JDK 11 with the unnamed module and is not needed).
jdk:
  - openjdk11
before_install:
  - sdk install maven 3.9.9
install:
  - mvn -B install -DskipTests -Dmaven.javadoc.skip=true
